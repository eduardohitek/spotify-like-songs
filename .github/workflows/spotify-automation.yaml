name: Spotify Automation

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

jobs:
  spotify-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Spotify Automation
        run: go run ./cmd/monthly-playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

  # GitHub disables scheduled workflows after 60 days without repository activity;
  # re-enabling through the API resets that timer.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Keep scheduled workflow enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/spotify-automation.yaml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
